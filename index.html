<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التمرير بعد القرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --background: #F4F1EA;
    --surface: #FBF9F4;
    --primary: #2E4A3C;
    --text-primary: #191C1A;
    --text-secondary: #5A6058;
    --rule: #D9D3C6;
    --jadwal-fine: #6E8C7C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--text-primary);
    font-family: "Noto Sans Arabic", sans-serif;
    font-size: 17px;
    line-height: 1.85;
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 16px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.7;
    margin: 0 0 4px;
  }
  .meta {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-secondary);
    margin: 0;
  }
  .jadwal {
    border-top: 2px solid var(--primary);
    margin: 16px 0 40px;
  }
  .jadwal::after {
    content: "";
    display: block;
    margin-top: 3px;
    border-top: 1px solid var(--jadwal-fine);
  }
  a.card {
    display: block;
    background: var(--surface);
    border-radius: 12px;
    padding: 16px;
    margin: 0 0 24px;
    color: var(--text-primary);
    font-size: 19px;
    font-weight: 700;
    line-height: 1.7;
    text-decoration: none;
  }
  a.card .hint {
    display: block;
    font-size: 15px;
    font-weight: 400;
    color: var(--text-secondary);
  }
  a:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 3px;
    border-radius: 12px;
  }
</style>
</head>
<body>
<main class="page">
  <h1>التمرير بعد القرآن</h1>
  <p class="meta">تطبيق يساعد على بناء عادة قراءة القرآن الكريم</p>
  <div class="jadwal"></div>

  <a class="card" href="privacy.html">
    سياسة الخصوصية
    <span class="hint">كل بياناتك على جهازك — لا تتبّع، لا تحليلات، لا خوادم</span>
  </a>
  <a class="card" href="terms.html">
    شروط الاستخدام
    <span class="hint">طبيعة التطبيق ومسؤولياتك وحدود المسؤولية</span>
  </a>
</main>
</body>
</html>
